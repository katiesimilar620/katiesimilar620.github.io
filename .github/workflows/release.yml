name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A5639C: ${{ secrets.A5639C }}
          BC5ED5: ${{ secrets.BC5ED5 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A5639C', '')
          sec_b = os.environ.get('BC5ED5', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 2b40f02fc33d393531463603 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- a788a1551c51c6a6c4f9601bd13e34d16f -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
